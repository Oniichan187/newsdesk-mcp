# Allowed news sources (allowlist).
#
# Only articles on these domains — or their subdomains (www., news., …) — may be cited in a story.
# The relay rejects any other source URL, and scripts/build_prompt.py tells ChatGPT to go through
# exactly this list. Primary sources (courts, parliaments, agencies) may still be *read* to verify
# facts, but posts link only to these outlets.
#
# To change the list for your own installation without touching the code, copy this file to
# /etc/newsrelay/sources.toml, edit it, and restart: sudo systemctl restart newsrelay-api

# --- Germany: newspapers & magazines
[[source]]
name = "taz"
domains = ["taz.de"]

[[source]]
name = "Frankfurter Rundschau"
domains = ["fr.de"]

[[source]]
name = "Die Zeit"
domains = ["zeit.de"]

[[source]]
name = "Süddeutsche Zeitung"
domains = ["sueddeutsche.de", "sz.de"]

[[source]]
name = "Der Spiegel"
domains = ["spiegel.de"]

[[source]]
name = "Tagesspiegel"
domains = ["tagesspiegel.de"]

