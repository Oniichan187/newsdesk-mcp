# resolv.conf for newsrelay-tunnel.service only (bind-mounted over /etc/resolv.conf in its namespace).
# cloudflared's Go resolver failed on Tailscale MagicDNS answers for region1.v2.argotunnel.com, so the
# tunnel uses public resolvers directly; the rest of the system keeps MagicDNS.
nameserver 1.1.1.1
nameserver 9.9.9.9
nameserver 2606:4700:4700::1111
options timeout:2 attempts:2
