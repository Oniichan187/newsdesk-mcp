[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "newsrelay"
version = "1.8.0"
description = "ChatGPT -> Discord news relay: dedup memory, durable outbox, MCP interface"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime deps are pinned exactly in requirements.lock; ranges here only document intent.
dependencies = [
    "mcp>=2.3,<3",
    "uvicorn>=0.54",
    "starlette>=1.7",
    "pydantic>=2.13,<3",
    "httpx2>=2.13",
    "rapidfuzz>=3.14,<4",
    "websockets>=17.1,<18",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.16", "mypy>=2.4"]

[project.scripts]
newsrelay = "newsrelay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsrelay = ["migrations/*.sql", "sources.toml", "briefing/fonts/*.ttf", "briefing/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "S608", "E501", "SIM105", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "B017", "RUF059"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src/newsrelay"]
